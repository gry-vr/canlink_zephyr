CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_EXTERNAL_LIBC=y
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_CAN=y
CONFIG_CAN_LOOPBACK=y
CONFIG_CAN_LOOPBACK_TX_THREAD_STACK_SIZE=4096
CONFIG_CAN_LOOPBACK_TX_MSGQ_SIZE=64
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_PRINTK=y
CONFIG_POLL=y
CONFIG_ZBUS=y
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_MAIN_THREAD_PRIORITY=10
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_ASSERT=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Explicit throttle defaults; set BAND_MAPPING=n for exact raw pass-through.
CONFIG_CANLINK_THROTTLE_BAND_MAPPING=y
CONFIG_CANLINK_THROTTLE_STALE_TIMEOUT_ENABLE=y
CONFIG_CANLINK_THROTTLE_STALE_TIMEOUT_MS=500
CONFIG_CANLINK_THROTTLE_STALE_OVERRIDE_DISABLED=y
